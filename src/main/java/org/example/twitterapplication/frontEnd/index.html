<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Users</h2>
        <button id="toggleCreateForm" class="btn btn-success">Create User</button>
    </div>

    <!-- Create User Form (hidden by default) -->
    <div id="createUserContainer" class="card mb-4" style="display: none;">
        <div class="card-body">
            <h5 class="card-title">New User Info</h5>
            <form id="createUserForm">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="userName" class="form-label">Name</label>
                        <input type="text" id="userName" class="form-control" required />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="userEmail" class="form-label">Email</label>
                        <input type="email" id="userEmail" class="form-control" required />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="userTimezone" class="form-label">Timezone (e.g., Europe/Kyiv)</label>
                        <input type="text" id="userTimezone" class="form-control" required />
                    </div>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- User Grid -->
    <div id="userGrid" class="row g-4"></div>

    <!-- Error Message -->
    <div id="errorMessage" class="alert alert-danger text-center mt-4" style="display: none;">
        Failed to load or create user data.
    </div>

</div>

<script src="users.js"></script>
</body>
</html>
