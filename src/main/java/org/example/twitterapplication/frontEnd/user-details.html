<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .delete-btn-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        .update-btn-container {
            position: absolute;
            bottom: 20px;
            right: 160px; /* Increased the right value to add more distance */
        }

        .back-btn-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }

    </style>
</head>
<body>
<div class="container mt-5">
    <a href="index.html" class="btn btn-secondary mb-4">← Back to users</a>
    <h2 class="text-center mb-4">User Details</h2>
    <div id="spinner" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none" role="alert">
        Failed to load user details.
    </div>

    <div id="userDetails" class="mt-4" style="display: none; position: relative;">
        <!-- User details will be loaded here -->
    </div>
</div>

<!-- Update User Modal -->
<div class="modal" id="updateUserModal" tabindex="-1" aria-labelledby="updateUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="updateUserModalLabel">Update User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="updateUserForm">
                    <div class="mb-3">
                        <label for="updateUserName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="updateUserName" required>
                    </div>
                    <div class="mb-3">
                        <label for="updateUserEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="updateUserEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="updateUserTimezone" class="form-label">Timezone</label>
                        <input type="text" class="form-control" id="updateUserTimezone" required>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="user-details.js"></script>
</body>
</html>
